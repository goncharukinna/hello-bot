apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-bot
  namespace: default
  labels:
    app: hello-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-bot
  template:
    metadata:
      labels:
        app: hello-bot
    spec:
      containers:
      - name: hello-bot
        image: docin82/hello-bot:v1.0.0   # Замените на ваш образ
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: bot-token
              key: BOT_TOKEN
        # 👇 Добавлено для RabbitMQ
        - name: RABBITMQ_HOST
          value: "my-rabbitmq.rabbitmq.svc.cluster.local"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: rabbitmq-username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: rabbitmq-password
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
